<title>Biblioteca di classe</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2b6cb0"><link rel="icon" href="icona-192.png">
<style>
:root{--b:#2b6cb0;--bg:#f4f8fc;--ok:#2f9e5b;--no:#d9534f;--wa:#e8a317;--tx:#1d2b3a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:17px}
header{background:var(--b);color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:20px;margin:0;flex:1}main{max-width:1000px;margin:0 auto;padding:14px}
button,.btn{font:inherit;border:0;border-radius:12px;padding:10px 16px;background:var(--b);color:#fff;cursor:pointer}
button.sec{background:#fff;color:var(--b);border:2px solid var(--b)}button.ok{background:var(--ok)}button.no{background:var(--no)}button.big{font-size:24px;padding:22px 26px;border-radius:18px}
input,select{font:inherit;padding:10px 12px;border:2px solid #c3d3e6;border-radius:10px;width:100%;background:#fff}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 6px #0001;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.book{cursor:pointer;border-left:8px solid var(--g,#999)}.book h3{margin:0 0 4px;font-size:16px}.small{font-size:14px;color:#566}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:#e6eef8;font-size:13px;margin:2px 2px 0 0}
.av{background:#d8f3e3;color:#17673a}.nav{background:#fbdcdc;color:#8a1f1c}.av,.nav{padding:2px 9px;border-radius:99px;font-size:13px;display:inline-block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{background:#fff;color:var(--b);border:2px solid var(--b);padding:5px 12px;border-radius:99px}.chip.on{background:var(--b);color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:#fff;color:var(--b);border:2px solid var(--b)}.tabs button.on{background:var(--b);color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}.row>.f{flex:1 1 200px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:6px 8px;border-bottom:1px solid #e3eaf3;text-align:left}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2b3a;color:#fff;padding:12px 20px;border-radius:12px;z-index:50;max-width:90%}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:20}.modal>div{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:640px;max-height:88vh;overflow:auto}
.step{font-size:15px;color:#fff;background:var(--b);border-radius:99px;padding:3px 12px;display:inline-block;margin-bottom:8px}
.banner{background:#fff3cd;border:2px solid var(--wa);padding:10px;border-radius:12px;margin-bottom:12px}
.big-in{font-size:30px;text-align:center;letter-spacing:3px;text-transform:uppercase}
.stars button{font-size:28px;background:#fff;color:#e8a317;padding:4px 10px}
@media print{header,.tabs,button,.noprint,.banner{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style></head><body>

function conv(L,U,wl,pwd){let n=1;const oggi=()=>Date.now(),norm=c=>String(c||'').trim().toUpperCase();const P=[];Object.values(U||{}).forEach(u=>{(u.storico||[]).forEach(p=>P.push({pid:n++,libro:p.id,cod:u.code,dal:Date.parse(p.data)||oggi(),reso:Date.parse(p.dataRestituzione)||oggi(),voto:0,banco:false}));(u.prestiti||[]).forEach(p=>P.push({pid:n++,libro:p.id,cod:u.code,dal:Date.parse(p.data)||oggi(),reso:null,voto:0,banco:false}))});
 wl=(wl||[]).map(norm).filter(Boolean);return{v:5,libri:L.map(l=>({id:l.id,titolo:l.titolo,autore:l.autore||'Autore sconosciuto',copie:l.copie||l['quantità']||1,eta:l.eta||l.eta_minima||6,genere:l.genere})),prestiti:P,log:[],wl,wlOn:wl.length>0,pwd:pwd||'scuola2025',nid:n,lastBackup:oggi()}}

function presta(id,cod,banco){const l=libro(id);if(!l)return'Libro non trovato';if(disp(l)<1)return'Nessuna copia libera';
 if(S.prestiti.some(p=>p.libro===id&&p.cod===cod&&!p.reso))return'Hai già questo libro';
 if(!codeOk(cod))return'Codice non valido';
 S.prestiti.push({pid:S.nid++,libro:id,cod,dal:oggi(),reso:null,voto:0,banco:!!banco,bib:banco?ui.turno:''});S.log.push({t:oggi(),a:'prestito',libro:id,cod,banco:!!banco,bib:banco?ui.turno:''});save();return''}

function consigli(cod,n=6){const h=storia(cod),letti=new Set(h.map(p=>p.libro));const gw={},aut=new Set();let es=0;
 h.forEach(p=>{const l=libro(p.libro);if(!l)return;const w=p.voto===1?.3:p.voto===3?1.6:1;gw[l.genere]=(gw[l.genere]||0)+w;aut.add(l.autore);es+=l.eta});
 const em=h.length?es/h.length:null,mx=Math.max(1,...Object.values(gw));
 return S.libri.filter(l=>!letti.has(l.id)&&disp(l)>0).map(l=>{let s=Math.random()*.4,m='';
  if(gw[l.genere]){s+=2+3*gw[l.genere]/mx;m=`Ti piacciono i libri di ${l.genere}`}
  if(em&&Math.abs(l.eta-em)<=1)s+=1.5;else if(em&&l.eta>em+2)s-=2;
  if(aut.has(l.autore)&&l.autore!=='Autore sconosciuto'){s+=2;m=`Dello stesso autore di un libro che hai letto`}
  if(!S.prestiti.some(p=>p.libro===l.id)){s+=.8;if(!m)m='Nessuno l’ha ancora letto: scoprilo per primo!'}
  if(!m)m='Una scoperta nuova per te';return{l,s,m}}).sort((a,b)=>b.s-a.s).slice(0,n)}

  return`<div class="card">${back}<span class="step">Passo 2 di 2</span><h2>Libri di ${esc(b.cod)} da restituire</h2>${a.length?a.map(p=>{const l=libro(p.libro);return`<div class="row card"><div class="f"><b>${esc(l.titolo)}</b><div class="small">preso il ${gg(p.dal)}</div></div><button class="ok" data-act="rendi" data-v="${p.pid}">↩️ Restituisci</button></div>`}).join(''):'<p>Nessun libro da restituire 🎉</p>'}</div>`}

 if(!b.libro){return`<div class="card">${back}<span class="step">Passo 2 di 3</span><h2>Che libro prende ${esc(b.cod)}?</h2>${filtri()}<div id="lst">${listaLibri()}</div></div>`}
 const l=libro(b.libro);return`<div class="card" style="text-align:center"><p><button class="sec" data-act="bl" data-v="0">⬅ Cambia libro</button></p><span class="step">Passo 3 di 3</span><h2>Conferma</h2><p style="font-size:22px">👤 <b>${esc(b.cod)}</b> prende<br>📕 <b>${esc(l.titolo)}</b></p><button class="big ok" data-act="conf">✅ Conferma prestito</button></div>`}
function ultime(){const l=S.log.slice(-5).reverse();return`<div class="card"><h3>Ultime operazioni</h3>${l.length?l.map(o=>`<div class="small">${o.a==='prestito'?'📕':'↩️'} ${esc(o.cod)} · ${esc(libro(o.libro)?.titolo)} · ${new Date(o.t).toLocaleString('it-IT')}${o.bib?' · turno '+esc(o.bib):''}</div>`).join(''):'<p class="small">Ancora niente.</p>'}${l.length?'<p><button class="sec" data-act="undo">↩️ Annulla ultima operazione</button></p>':''}</div>`}
// Admin
function adminHTML(){const T=[['dash','📊 Cruscotto'],['pres','📤 Prestiti'],['cat','📚 Catalogo'],['let','👤 Lettori'],['sol','🖨️ Da sollecitare'],['fer','⏸ Libri fermi'],['tur','🧑‍🏫 Turni'],['bak','💾 Backup e impostazioni']];
 let h=`<div class="tabs">${T.map(t=>`<button class="${ui.tab===t[0]?'on':''}" data-act="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>`;
 return h+adminTab()}
function adminTab(){const t=ui.tab,P=S.prestiti;
 if(t==='dash'){const att=P.filter(p=>!p.reso);
  const cnt={};P.forEach(p=>cnt[p.libro]=(cnt[p.libro]||0)+1);const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const lett={};P.forEach(p=>lett[p.cod]=(lett[p.cod]||0)+1);const tl=Object.entries(lett).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return`${S.lds?`<div class="card"><b>⭐ Libro della settimana:</b> ${esc(libro(S.lds.id)?.titolo)} <button class="sec" data-act="ldsOff">Togli</button></div>`:''}<div class="grid"><div class="card"><h2>${S.libri.length}</h2>titoli (${S.libri.reduce((a,l)=>a+l.copie,0)} copie)</div><div class="card"><h2>${att.length}</h2>copie in prestito</div><div class="card"><h2>${new Set(P.map(p=>p.cod)).size}</h2>lettori attivi</div><div class="card"><h2>${P.length}</h2>prestiti totali</div></div>
  <div class="grid"><div class="card"><h3>🏆 Libri più letti</h3>${top.map(([i,n])=>`<div>${esc(libro(+i)?.titolo)} <b>(${n})</b></div>`).join('')||'<span class="small">Ancora nulla</span>'}</div><div class="card"><h3>🏅 Lettori più attivi</h3>${tl.map(([c,n])=>`<div>${esc(c)} <b>(${n} libri)</b></div>`).join('')||'<span class="small">Ancora nulla</span>'}</div></div>${ultime()}`}
 if(t==='pres'){const a=P.filter(p=>!p.reso).sort((x,y)=>x.dal-y.dal);
  return`<div class="card"><h3>Prestiti in corso (${a.length})</h3><table><tr><th>Lettore</th><th>Libro</th><th>Dal</th><th></th></tr>${a.map(p=>`<tr><td>${esc(p.cod)}</td><td>${esc(libro(p.libro)?.titolo)}</td><td>${gg(p.dal)}</td><td><button class="sec" data-act="rendiA" data-v="${p.pid}">Reso</button></td></tr>`).join('')}</table></div>`}
 if(t==='cat'){return`<div class="card"><div class="row"><div class="f"><input id="q" placeholder="🔎 Cerca" value="${esc(ui.q)}"></div><button data-act="nuovo">➕ Nuovo libro</button></div></div><div class="card"><table><tr><th>Titolo</th><th>Autore</th><th>Copie</th><th>Età</th><th>Genere</th><th></th></tr>${filtra().slice(0,80).map(l=>`<tr><td>${esc(l.titolo)}</td><td>${esc(l.autore)}</td><td>${disp(l)}/${l.copie}</td><td>${l.eta}</td><td>${l.genere}</td><td><button class="sec" data-act="mod" data-id="${l.id}">✏️</button></td></tr>`).join('')}</table></div>`}
 if(t==='let'){const c=[...new Set(P.map(p=>p.cod))].sort();return`<div class="card"><h3>Lettori (${c.length})</h3>${c.map(k=>{const s=storia(k);return`<div class="row"><b class="f">${esc(k)}</b><span class="small">${s.length} libri, ${s.filter(p=>!p.reso).length} in corso · ${badgesOf(k).b.map(x=>x.i).join('')}</span><button class="sec" data-act="stor" data-v="${esc(k)}">Storia</button></div>`}).join('')||'<p class="small">Nessun lettore ancora.</p>'}</div>`}
 if(t==='sol'){const a=P.filter(p=>!p.reso&&Math.floor((oggi()-p.dal)/864e5)>=ui.min).sort((x,y)=>x.dal-y.dal);
  return`<div class="card"><h3>Libri da sollecitare — ${new Date().toLocaleDateString('it-IT')}</h3><div class="row noprint"><label>Fuori da almeno <select id="minq">${[0,7,14,21,30].map(n=>`<option value="${n}" ${ui.min===n?'selected':''}>${n} giorni</option>`).join('')}</select></label><button data-act="stampa">🖨️ Stampa</button></div><table><tr><th>Lettore</th><th>Libro</th><th>Dal</th><th>Giorni</th></tr>${a.map(p=>`<tr><td>${esc(p.cod)}</td><td>${esc(libro(p.libro)?.titolo)}</td><td>${gg(p.dal)}</td><td>${Math.floor((oggi()-p.dal)/864e5)}</td></tr>`).join('')||'<tr><td colspan=4>Nessun libro 🎉</td></tr>'}</table><p class="small">Solo codici, nessun nome: puoi stamparla e usarla in classe.</p></div>`}
 if(t==='tur'){const n=c=>S.log.filter(o=>o.bib===c).length;return`<div class="card"><h3>Bibliotecari di turno</h3><p class="small">Dai a ogni bibliotecario un codice (es. BIB1, BIB2). Il banco chiederà chi è di turno e lo segnerà in ogni operazione.</p><div class="row"><input id="nb" class="f" maxlength="12" placeholder="Nuovo codice"><button data-act="addBib">➕ Aggiungi</button></div>${S.bibs.map(c=>`<div class="row"><b class="f">${esc(c)}</b><span class="small">${n(c)} operazioni</span><button class="sec" data-act="delBib" data-v="${esc(c)}">Rimuovi</button></div>`).join('')}</div>`}
 if(t==='fer'){const f=S.libri.filter(l=>!P.some(p=>p.libro===l.id));return`<div class="card"><h3>Libri mai presi in prestito (${f.length})</h3><p class="small">Idee: presentali in classe, mettili in vetrina, falli consigliare dai bibliotecari.</p>${f.map(l=>`<div>${GI[l.genere]||''} ${esc(l.titolo)} <span class="small">— ${esc(l.autore)}, ${l.genere}, dai ${l.eta}</span></div>`).join('')}</div>`}
 if(t==='bak'){return`<div class="card"><h3>💾 Backup</h3><p class="small">Ultimo backup: ${gg(S.lastBackup)}. Salva il file su chiavetta USB.</p><div class="row"><button data-act="exp">⬇️ Salva backup</button><label class="btn sec">⬆️ Ripristina da file<input type="file" id="imp" accept=".json" hidden></label></div></div>
 <div class="card"><h3>🔒 Codici ammessi (whitelist)</h3><label><input type="checkbox" id="wlon" style="width:auto" ${S.wlOn?'checked':''}> Accetta solo i codici in elenco</label><p class="small">Un codice per riga (3-12 lettere/numeri, senza nomi!).</p><textarea id="wl" rows="6" style="width:100%;font:inherit">${esc(S.wl.join('\n'))}</textarea><p><button data-act="wls">Salva elenco</button></p></div>
 <div class="card"><h3>🖥️ Dispositivo della biblioteca</h3><label><input type="checkbox" id="bh" style="width:auto" ${S.bancoHome?'checked':''}> All’apertura mostra subito il banco prestiti</label></div>
 <div class="card"><h3>🔑 Cambia password</h3><div class="row"><input id="np" type="password" placeholder="Nuova password (min 6)" class="f"><button data-act="pw">Cambia</button></div></div>
 <div class="card"><h3>🗑️ Azzeramento</h3><p class="small">Cancella i prestiti (non il catalogo), ad es. a fine anno. Fai prima un backup!</p><button class="no" data-act="rst">Azzera prestiti</button></div>`}}
// ---- eventi
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.v,id=+el.dataset.id;
 if(a==='chiudi'){if(e.target===el)modal('');return}
 const R=()=>{ui.focus=0;render()};
 if(a==='g'){ui.g=v;return R()}if(a==='e'){ui.e=v;return R()}
 if(a==='info')return info(id);
 if(a==='loginT'){modal(`<h3>Accesso insegnante</h3><input id="pw" type="password" placeholder="Password"><p><button data-act="okpw">Entra</button></p>`);return}
 if(a==='okpw'){if($('#pw').value===S.pwd){ui.admin=true;modal('');R()}else toast('Password errata');return}
 if(a==='entra'){const c=norm($('#cod').value);if(!codeOk(c))return toast('Codice non valido. Chiedi alla maestra.');ui.user=c;return R()}
 if(a==='esci'){ui.user=null;ui.admin=false;ui.tab='dash';return R()}
 if(a==='banco'){ui.banco=true;ui.bs={};ui.q=ui.g=ui.e='';return R()}
 if(a==='esciBanco'){modal(`<h3>Uscire dal banco?</h3><p>Serve la password della maestra.</p><input id="pw2" type="password"><p><button data-act="okEsci">Esci</button></p>`);return}
 if(a==='okEsci'){if($('#pw2').value===S.pwd){ui.banco=false;ui.admin=true;modal('');R()}else toast('Password errata');return}
 if(a==='bm'){ui.bs=v?{m:v}:{};ui.q=ui.g=ui.e='';return R()}
 if(a==='bcod'){const c=norm($('#bcod').value);if(!codeOk(c))return toast('Codice non valido');ui.bs.cod=c;return R()}
 if(a==='bl'){ui.bs.libro=+v||0;return R()}
 if(a==='conf'){const r=presta(ui.bs.libro,ui.bs.cod,true);if(r)toast(r);else{toast('✅ Prestito registrato!');ui.bs={}}return R()}
 if(a==='rendi'){rendi(+v,true);ui.bs.fatto=+v;toast('↩️ Reso registrato');return R()}
 if(a==='voto'){const p=S.prestiti.find(x=>x.pid===ui.bs.fatto);if(p){p.voto=+v;save()}toast('Grazie!');return}
 if(a==='undo'){const r=annulla();toast(r||'Operazione annullata');return R()}
 if(a==='tab'){ui.tab=v;ui.q='';return R()}
 if(a==='rendiA'){rendi(+v,false);return R()}
 if(a==='exp'){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='backup-biblioteca-'+new Date().toISOString().slice(0,10)+'.json';l.click();S.lastBackup=oggi();save();return R()}
 if(a==='wls'){S.wl=$('#wl').value.split(/\s+/).map(norm).filter(Boolean);S.wlOn=$('#wlon').checked;save();return toast('Elenco salvato')}
 if(a==='pw'){const p=$('#np').value;if(p.length<6)return toast('Almeno 6 caratteri');S.pwd=p;save();$('#np').value='';return toast('Password cambiata')}
 if(a==='rst'){if(confirm('Azzerare tutti i prestiti?')){S.prestiti=[];S.log=[];save();R()}return}
 if(a==='turno'){ui.turno=v;return R()}
 if(a==='addBib'){const c=norm($('#nb').value);if(!/^[A-Z0-9]{2,12}$/.test(c))return toast('Codice non valido');if(!S.bibs.includes(c))S.bibs.push(c);save();return R()}
 if(a==='delBib'){S.bibs=S.bibs.filter(x=>x!==v);if(ui.turno===v)ui.turno='';save();return R()}
 if(a==='lds'){S.lds={id,nota:$('#ln').value.trim().slice(0,140),t:oggi()};save();modal('');ui.bs={};toast('⭐ Libro della settimana scelto!');return R()}
 if(a==='ldsOff'){S.lds=null;save();return R()}
 if(a==='stampa')return window.print();
 if(a==='stor'){const s=storia(v);modal(`<h3>Storia di ${esc(v)}</h3>${badgeHTML(v)}${s.map(p=>`<div>${esc(libro(p.libro)?.titolo)} <span class="small">${gg(p.dal)} → ${p.reso?gg(p.reso):'in corso'}</span></div>`).join('')}<p><button data-act="chiudi">Chiudi</button></p>`);return}
 if(a==='nuovo')return edit(null);if(a==='mod')return edit(id);
 if(a==='salva'){const f=x=>$('#'+x).value;const o={titolo:f('et').trim(),autore:f('ea').trim()||'Autore sconosciuto',copie:Math.max(1,+f('ec')||1),eta:+f('ee')||6,genere:f('eg').trim().toLowerCase()||'narrativa'};if(!o.titolo)return toast('Serve il titolo');
  if(el.dataset.id){Object.assign(libro(+el.dataset.id),o)}else S.libri.push({id:Math.max(0,...S.libri.map(l=>l.id))+1,...o});save();modal('');return R()}
 if(a==='elim'){if(attivi(id).length)return toast('Ci sono copie in prestito');if(confirm('Eliminare il libro?')){S.libri=S.libri.filter(l=>l.id!==id);save();modal('');R()}return}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;const l=$('#lst');if(l)l.innerHTML=listaLibri();else{ui.focus=1;render()}}});
document.addEventListener('change',e=>{if(e.target.id==='minq'){ui.min=+e.target.value;render();return}if(e.target.id==='bh'){S.bancoHome=e.target.checked;save();return}if(e.target.id==='imp'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.libri)throw 0;if(d.v!==5){d=conv(d.libri,d.utenti,d.whitelist,S.pwd)}if(!d.prestiti)throw 0;S=d;save();toast('Backup ripristinato');render()}catch(x){toast('File non valido')}};r.readAsText(f)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=e.target.id==='cod'?'entra':e.target.id==='bcod'?'bcod':e.target.id==='pw'?'okpw':e.target.id==='pw2'?'okEsci':'';if(b){const x=document.querySelector('[data-act='+b+']');x&&x.click()}}});
function info(id){const l=libro(id);const mia=ui.user&&attivi(id).some(p=>p.cod===ui.user);
 if(ui.banco){if(ui.bs.m==='w'){modal(`<h3>⭐ ${esc(l.titolo)}</h3><p>Perché lo consigli? (facoltativo, senza nomi)</p><input id="ln" maxlength="140"><p class="row"><button class="ok" data-act="lds" data-id="${id}">Scegli questo libro</button><button class="sec" data-act="chiudi">Annulla</button></p>`);return}ui.bs.libro=id;modal('');return render()}
 modal(`<h2>${GI[l.genere]||'📖'} ${esc(l.titolo)}</h2><p>${esc(l.autore)}</p><p><span class="tag">${l.genere}</span><span class="tag">dai ${l.eta} anni</span></p><p>${dispTag(l)}</p>${ui.user&&!mia&&disp(l)>0&&!ui.admin?`<p class="small">Vai dal bibliotecario per prenderlo in prestito.</p>`:''}<p><button class="sec" data-act="chiudi">Chiudi</button></p>`)}
function edit(id){const l=id?libro(id):{titolo:'',autore:'',copie:1,eta:6,genere:'narrativa'};
 modal(`<h3>${id?'Modifica':'Nuovo'} libro</h3><label>Titolo<input id="et" value="${esc(l.titolo)}"></label><label>Autore<input id="ea" value="${esc(l.autore)}"></label><div class="row"><label class="f">Copie<input id="ec" type="number" min="1" value="${l.copie}"></label><label class="f">Età minima<input id="ee" type="number" min="5" max="12" value="${l.eta}"></label></div><label>Genere<input id="eg" list="gl" value="${esc(l.genere)}"></label><datalist id="gl">${Object.keys(GC).map(g=>`<option>${g}`).join('')}</datalist><p class="row"><button class="ok" data-act="salva" ${id?`data-id="${id}"`:''}>Salva</button>${id?`<button class="no" data-act="elim" data-id="${id}">Elimina</button>`:''}<button class="sec" data-act="chiudi">Annulla</button></p>`)}
render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
